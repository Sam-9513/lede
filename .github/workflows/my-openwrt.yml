name: My-OpenWrt

on:
  # 定时触发（如需开启，删除下面两行的 # 号即可）
  # schedule:
  #   - cron: '0 20 * * *'
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-24.04

    steps:
      # 1. 释放磁盘空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. 拉取你当前分支，并在云端临时合并上游最新源码（绝不污染你的仓库）
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

#      - name: Sync Upstream Source
#        run: |
#          HOST="github.com"
#          REPO="coolsnowwolf/lede.git"
#          git config user.name "github-actions[bot]"
#          git config user.email "zsc71ok@gmail.com"
#          git remote add upstream "https://${HOST}/${REPO}"
#          git fetch upstream master --depth=1
#          git merge upstream/master --allow-unrelated-histories -m "Sync upstream" || true


      # 3. 安装 Lean LEDE 编译依赖
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 4. 更新并安装 Feeds（如需追加第三方源，直接在这里写 echo >> feeds.conf.default）
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 锁定 7.3 内核并加载你的 my.config
      - name: Generate configuration file
        run: |
          sed -i 's/KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=7.3/g' target/linux/x86/Makefile
          cp -f my.config .config
          make defconfig

      # 6. 下载源码包并清理残缺文件
      - name: Download packages
        run: |
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 7. 编译固件
      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          df -h
          echo "======================="

      # 8. 清理目标目录中的冗余 packages 文件夹，仅保留固件
      - name: Prepare firmware
        run: |
          rm -rf $(find ./bin/targets/ -type d -name "packages")

      # 9. 上传最终固件
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/
